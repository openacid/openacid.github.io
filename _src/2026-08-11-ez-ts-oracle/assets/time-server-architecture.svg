<?xml version="1.0" encoding="UTF-8"?>
<?xml-stylesheet type="text/css" href="svg.css"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Timestamp oracle data paths</title>
  <desc id="desc">Get-timestamp requests use the Leader's in-memory Reserved range. A Tokio reservation task connects that range to the Leader's EzRaft instance. The Leader EzRaft instance is both part of the Leader process and one replica in the three-node EzRaft cluster.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#627fa6"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#5b8b83"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#b28a55"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#738094"/>
    </marker>
  </defs>

  <rect class="canvas" x="10" y="10" width="1380" height="760" rx="28"/>
  <text class="title" x="60" y="64">get-timestamp requests use memory; reservation uses Raft</text>

  <rect class="panel" x="130" y="495" width="1240" height="240" rx="26"/>
  <rect class="badge-teal" x="145" y="512" width="310" height="42" rx="21"/>
  <text class="label teal-text" x="300" y="541" text-anchor="middle">EzRaft cluster · 3 replicas</text>

  <path class="leader-frame" d="M240 108H880Q910 108 910 138V468Q910 494 884 494H875V684Q875 714 845 714H555Q525 714 525 684V494H266Q240 494 240 468Z"/>
  <rect class="badge-blue" x="266" y="130" width="190" height="42" rx="21"/>
  <text class="label blue-text" x="361" y="159" text-anchor="middle">Leader process</text>

  <g transform="translate(42 202)">
    <rect class="panel" width="180" height="132" rx="21"/>
    <circle cx="42" cy="42" r="21" fill="#627fa6"/>
    <path d="M31 42h22M46 34l8 8-8 8" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="panel-title" x="88" y="39">Client</text>
    <text class="mono muted-text" x="88" y="67">/time</text>
    <text class="small" x="90" y="99" text-anchor="middle">get-timestamp</text>
    <text class="small" x="90" y="119" text-anchor="middle">request</text>
  </g>

  <g transform="translate(276 194)">
    <rect class="handler-box" width="240" height="116" rx="20"/>
    <text class="panel-title" x="120" y="38" text-anchor="middle">HTTP handler</text>
    <text class="mono" x="120" y="68" text-anchor="middle">next_timestamp()</text>
    <text class="small blue-text" x="120" y="96" text-anchor="middle">Local allocation</text>
  </g>

  <g transform="translate(570 174)">
    <rect class="cache-box" width="300" height="160" rx="20"/>
    <text class="panel-title amber-text" x="100" y="39" text-anchor="middle">Reserved</text>
    <rect class="badge-amber" x="190" y="14" width="92" height="36" rx="18"/>
    <text class="small amber-text" x="236" y="39" text-anchor="middle">Memory</text>
    <text class="mono muted-text" x="24" y="70">term</text>
    <rect class="issued" x="24" y="91" width="110" height="34" rx="7"/>
    <rect class="available" x="134" y="91" width="142" height="34" rx="7"/>
    <line class="tick-strong" x1="134" y1="82" x2="134" y2="135"/>
    <text class="tiny" x="24" y="151">issued</text>
    <text class="tiny" x="134" y="151" text-anchor="middle">next</text>
    <text class="tiny" x="276" y="151" text-anchor="end">end</text>
  </g>

  <path class="arrow-local" d="M222 246H276"/>
  <path class="arrow-local" d="M516 246H570"/>
  <text class="small blue-text" x="543" y="234" text-anchor="middle">take()</text>
  <path class="arrow-local" d="M570 296H530V350H132V334"/>
  <text class="small blue-text" x="364" y="340" text-anchor="middle">timestamp</text>

  <g transform="translate(580 365)">
    <rect class="task-box" width="280" height="90" rx="20"/>
    <text class="panel-title" x="140" y="37" text-anchor="middle">Reservation task</text>
    <text class="small teal-text" x="140" y="66" text-anchor="middle">Tokio task · refill()</text>
  </g>
  <path class="arrow-cache" d="M720 365V334"/>
  <text class="small amber-text" x="735" y="357">install range</text>

  <g transform="translate(145 560)">
    <rect class="follower-frame" width="310" height="130" rx="19"/>
    <text class="small teal-text" x="155" y="27" text-anchor="middle">Follower A</text>
    <text class="panel-title" x="155" y="59" text-anchor="middle">EzRaft</text>
    <text class="small" x="155" y="86" text-anchor="middle">(OpenRaft)</text>
    <text class="small" x="155" y="116" text-anchor="middle">state machine: reserved_end</text>
  </g>
  <g transform="translate(545 560)">
    <rect class="leader-frame" width="310" height="130" rx="19"/>
    <text class="small blue-text" x="155" y="27" text-anchor="middle">Leader</text>
    <text class="panel-title" x="155" y="59" text-anchor="middle">EzRaft</text>
    <text class="small" x="155" y="86" text-anchor="middle">(OpenRaft)</text>
    <text class="small" x="155" y="116" text-anchor="middle">state machine: reserved_end</text>
  </g>
  <g transform="translate(945 560)">
    <rect class="follower-frame" width="310" height="130" rx="19"/>
    <text class="small teal-text" x="155" y="27" text-anchor="middle">Follower B</text>
    <text class="panel-title" x="155" y="59" text-anchor="middle">EzRaft</text>
    <text class="small" x="155" y="86" text-anchor="middle">(OpenRaft)</text>
    <text class="small" x="155" y="116" text-anchor="middle">state machine: reserved_end</text>
  </g>

  <path class="arrow-raft" d="M720 455V560"/>
  <text class="small teal-text" x="735" y="510">write Reserve</text>
  <path class="arrow-raft" d="M545 625H455"/>
  <path class="arrow-raft" d="M855 625H945"/>
  <text class="small teal-text" x="500" y="613" text-anchor="middle">replicate</text>
  <text class="small teal-text" x="900" y="613" text-anchor="middle">replicate</text>
</svg>
