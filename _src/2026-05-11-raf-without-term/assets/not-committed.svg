<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 620" role="img" aria-label="Not committed yet: quorum has not matched the leader's term index">
  <style>
    svg { background: #f8fafc; color: #172033;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .canvas { fill: #f8fafc; }
    .title { fill: #172033; font-size: 18px; font-weight: 700; }
    .label { fill: #172033; font-size: 13px; font-weight: 650; }
    .node-label { fill: #667085; font-size: 12px; font-weight: 600; }
    .small { fill: #667085; font-size: 12px; font-weight: 500; }
    .code { fill: #172033; font-family: "SFMono-Regular", Consolas,
      "Liberation Mono", Menlo, monospace; font-size: 18px; }
    .label-strong { fill: #dc2626; font-size: 13px; font-weight: 700; }
    .label-leader { fill: #2563eb; font-size: 13px; font-weight: 700; }
    .entry { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.25; }
    .entry-term { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1.25; }
    .entry-term-new { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2.5; }
    .entry-cmd { fill: #d1fae5; stroke: #10b981; stroke-width: 1.25; }
    .entry-conflict { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .arrow { fill: none; stroke: #667085; stroke-width: 2;
      marker-end: url("#arrowhead"); }
    .divider { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 2 3; }
  </style>

  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#667085"/>
    </marker>
  </defs>

  <rect class="canvas" width="700" height="620"/>

  <text class="title" x="20" y="26">Not committed yet</text>
  <text class="label" x="20" y="50">leader term = 6</text>

  <!-- ============ Node A ============ -->
  <text class="label" x="62" y="92" text-anchor="end">terms</text>
  <rect class="entry-term" x="70"  y="70" width="44" height="32" rx="3"/>
  <text class="code" x="92"  y="93" text-anchor="middle">0</text>
  <rect class="entry-term" x="120" y="70" width="44" height="32" rx="3"/>
  <text class="code" x="142" y="93" text-anchor="middle">1</text>
  <rect class="entry-term" x="170" y="70" width="44" height="32" rx="3"/>
  <text class="code" x="192" y="93" text-anchor="middle">2</text>
  <rect class="entry-term" x="220" y="70" width="44" height="32" rx="3"/>
  <text class="code" x="242" y="93" text-anchor="middle">2</text>
  <rect class="entry-conflict" x="270" y="70" width="44" height="32" rx="3"/>
  <text class="code" x="292" y="93" text-anchor="middle">2</text>
  <rect class="entry-conflict" x="320" y="70" width="44" height="32" rx="3"/>
  <text class="code" x="342" y="93" text-anchor="middle">2</text>
  <rect class="entry-term" x="370" y="70" width="44" height="32" rx="3"/>
  <text class="code" x="392" y="93" text-anchor="middle">6</text>

  <text class="label" x="62" y="136" text-anchor="end">cmds</text>
  <rect class="entry" x="70"  y="114" width="44" height="32" rx="3"/>
  <text class="code" x="92"  y="137" text-anchor="middle">ø</text>
  <rect class="entry" x="120" y="114" width="44" height="32" rx="3"/>
  <text class="code" x="142" y="137" text-anchor="middle">ø</text>
  <rect class="entry" x="170" y="114" width="44" height="32" rx="3"/>
  <text class="code" x="192" y="137" text-anchor="middle">ø</text>
  <rect class="entry-cmd" x="220" y="114" width="44" height="32" rx="3"/>
  <text class="code" x="242" y="137" text-anchor="middle">c</text>
  <rect class="entry-conflict" x="270" y="114" width="44" height="32" rx="3"/>
  <text class="code" x="292" y="137" text-anchor="middle">x</text>
  <rect class="entry" x="320" y="114" width="44" height="32" rx="3"/>
  <text class="code" x="342" y="137" text-anchor="middle">ø</text>
  <rect class="entry" x="370" y="114" width="44" height="32" rx="3"/>
  <text class="code" x="392" y="137" text-anchor="middle">ø</text>

  <line class="arrow" x1="55" y1="166" x2="440" y2="166"/>
  <text class="node-label" x="448" y="170">Node A</text>

  <text class="label" x="62" y="190" text-anchor="end">index</text>
  <text class="small" x="92"  y="190" text-anchor="middle">0</text>
  <text class="small" x="142" y="190" text-anchor="middle">1</text>
  <text class="small" x="192" y="190" text-anchor="middle">2</text>
  <text class="small" x="242" y="190" text-anchor="middle">3</text>
  <text class="small" x="292" y="190" text-anchor="middle">4</text>
  <text class="small" x="342" y="190" text-anchor="middle">5</text>
  <text class="small" x="392" y="190" text-anchor="middle">6</text>
  <text class="small" x="442" y="190" text-anchor="middle">7</text>

  <line class="divider" x1="20" y1="208" x2="580" y2="208"/>

  <!-- ============ Node B ============ -->
  <text class="label" x="62" y="234" text-anchor="end">terms</text>
  <rect class="entry-term" x="70"  y="212" width="44" height="32" rx="3"/>
  <text class="code" x="92"  y="235" text-anchor="middle">0</text>
  <rect class="entry-term" x="120" y="212" width="44" height="32" rx="3"/>
  <text class="code" x="142" y="235" text-anchor="middle">1</text>
  <rect class="entry-term" x="170" y="212" width="44" height="32" rx="3"/>
  <text class="code" x="192" y="235" text-anchor="middle">2</text>
  <rect class="entry-term" x="220" y="212" width="44" height="32" rx="3"/>
  <text class="code" x="242" y="235" text-anchor="middle">2</text>
  <rect class="entry-conflict" x="270" y="212" width="44" height="32" rx="3"/>
  <text class="code" x="292" y="235" text-anchor="middle">2</text>
  <rect class="entry-conflict" x="320" y="212" width="44" height="32" rx="3"/>
  <text class="code" x="342" y="235" text-anchor="middle">2</text>
  <rect class="entry-term" x="370" y="212" width="44" height="32" rx="3"/>
  <text class="code" x="392" y="235" text-anchor="middle">6</text>

  <text class="label" x="62" y="278" text-anchor="end">cmds</text>
  <rect class="entry" x="70"  y="256" width="44" height="32" rx="3"/>
  <text class="code" x="92"  y="279" text-anchor="middle">ø</text>
  <rect class="entry" x="120" y="256" width="44" height="32" rx="3"/>
  <text class="code" x="142" y="279" text-anchor="middle">ø</text>
  <rect class="entry" x="170" y="256" width="44" height="32" rx="3"/>
  <text class="code" x="192" y="279" text-anchor="middle">ø</text>
  <rect class="entry-cmd" x="220" y="256" width="44" height="32" rx="3"/>
  <text class="code" x="242" y="279" text-anchor="middle">c</text>
  <rect class="entry-conflict" x="270" y="256" width="44" height="32" rx="3"/>
  <text class="code" x="292" y="279" text-anchor="middle">x</text>

  <line class="arrow" x1="55" y1="308" x2="440" y2="308"/>
  <text class="node-label" x="448" y="312">Node B</text>

  <text class="label" x="62" y="332" text-anchor="end">index</text>
  <text class="small" x="92"  y="332" text-anchor="middle">0</text>
  <text class="small" x="142" y="332" text-anchor="middle">1</text>
  <text class="small" x="192" y="332" text-anchor="middle">2</text>
  <text class="small" x="242" y="332" text-anchor="middle">3</text>
  <text class="small" x="292" y="332" text-anchor="middle">4</text>
  <text class="small" x="342" y="332" text-anchor="middle">5</text>
  <text class="small" x="392" y="332" text-anchor="middle">6</text>
  <text class="small" x="442" y="332" text-anchor="middle">7</text>

  <line class="divider" x1="20" y1="350" x2="580" y2="350"/>

  <!-- ============ Node C (new leader) ============ -->
  <text class="label" x="62" y="376" text-anchor="end">terms</text>
  <rect class="entry-term" x="70"  y="354" width="44" height="32" rx="3"/>
  <text class="code" x="92"  y="377" text-anchor="middle">0</text>
  <rect class="entry-term" x="120" y="354" width="44" height="32" rx="3"/>
  <text class="code" x="142" y="377" text-anchor="middle">1</text>
  <rect class="entry-term" x="170" y="354" width="44" height="32" rx="3"/>
  <text class="code" x="192" y="377" text-anchor="middle">2</text>
  <rect class="entry-term" x="220" y="354" width="44" height="32" rx="3"/>
  <text class="code" x="242" y="377" text-anchor="middle">2</text>
  <rect class="entry-term" x="270" y="354" width="44" height="32" rx="3"/>
  <text class="code" x="292" y="377" text-anchor="middle">5</text>
  <rect class="entry-term" x="320" y="354" width="44" height="32" rx="3"/>
  <text class="code" x="342" y="377" text-anchor="middle">5</text>
  <rect class="entry-term" x="370" y="354" width="44" height="32" rx="3"/>
  <text class="code" x="392" y="377" text-anchor="middle">5</text>
  <rect class="entry-term-new" x="420" y="354" width="44" height="32" rx="3"/>
  <text class="code" x="442" y="377" text-anchor="middle">7</text>

  <text class="label" x="62" y="420" text-anchor="end">cmds</text>
  <rect class="entry" x="70"  y="398" width="44" height="32" rx="3"/>
  <text class="code" x="92"  y="421" text-anchor="middle">ø</text>
  <rect class="entry" x="120" y="398" width="44" height="32" rx="3"/>
  <text class="code" x="142" y="421" text-anchor="middle">ø</text>
  <rect class="entry" x="170" y="398" width="44" height="32" rx="3"/>
  <text class="code" x="192" y="421" text-anchor="middle">ø</text>
  <rect class="entry-cmd" x="220" y="398" width="44" height="32" rx="3"/>
  <text class="code" x="242" y="421" text-anchor="middle">c</text>
  <rect class="entry" x="270" y="398" width="44" height="32" rx="3"/>
  <text class="code" x="292" y="421" text-anchor="middle">ø</text>
  <rect class="entry" x="320" y="398" width="44" height="32" rx="3"/>
  <text class="code" x="342" y="421" text-anchor="middle">ø</text>
  <rect class="entry" x="370" y="398" width="44" height="32" rx="3"/>
  <text class="code" x="392" y="421" text-anchor="middle">ø</text>

  <line class="arrow" x1="55" y1="450" x2="490" y2="450"/>
  <text class="node-label" x="498" y="454">Node C</text>
  <text class="label-leader" x="498" y="472">← new leader (term 7)</text>

  <text class="label" x="62" y="474" text-anchor="end">index</text>
  <text class="small" x="92"  y="474" text-anchor="middle">0</text>
  <text class="small" x="142" y="474" text-anchor="middle">1</text>
  <text class="small" x="192" y="474" text-anchor="middle">2</text>
  <text class="small" x="242" y="474" text-anchor="middle">3</text>
  <text class="small" x="292" y="474" text-anchor="middle">4</text>
  <text class="small" x="342" y="474" text-anchor="middle">5</text>
  <text class="small" x="392" y="474" text-anchor="middle">6</text>
  <text class="small" x="442" y="474" text-anchor="middle">7</text>

  <line class="divider" x1="20" y1="496" x2="580" y2="496"/>

  <!-- Explanation footer -->
  <rect class="entry-conflict" x="20" y="520" width="14" height="14" rx="2"/>
  <text class="small" x="40" y="532">index 4 and 5 replicated to quorum A+B,</text>
  <text class="small" x="40" y="552">but quorum has not matched index 6 (the leader's own term index).</text>
  <text class="small" x="40" y="580">These entries can still be overwritten by a higher-term leader like Node C.</text>
</svg>
