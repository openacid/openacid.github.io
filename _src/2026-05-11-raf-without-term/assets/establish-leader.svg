<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" role="img" aria-label="Establish leader: cmds backfilled to match terms length">
  <style>
    svg { background: #f8fafc; color: #172033;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .canvas { fill: #f8fafc; }
    .title { fill: #172033; font-size: 18px; font-weight: 700; }
    .label { fill: #172033; font-size: 13px; font-weight: 650; }
    .small { fill: #667085; font-size: 12px; font-weight: 500; }
    .code { fill: #172033; font-family: "SFMono-Regular", Consolas,
      "Liberation Mono", Menlo, monospace; font-size: 18px; }
    .entry { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.25; }
    .entry-term { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1.25; }
    .entry-term-new { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2.5; }
    .entry-cmd { fill: #d1fae5; stroke: #10b981; stroke-width: 1.25; }
    .entry-match { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .arrow { fill: none; stroke: #667085; stroke-width: 2;
      marker-end: url("#arrowhead"); }
  </style>

  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#667085"/>
    </marker>
  </defs>

  <rect class="canvas" width="600" height="250"/>

  <text class="title" x="20" y="26">Establish leader</text>
  <text class="small" x="20" y="48">term 5 candidate becomes leader; index 4 and 5 are backfilled as term 5 empty entries.</text>

  <!-- Terms row -->
  <text class="label" x="62" y="100" text-anchor="end">terms</text>
  <rect class="entry-term" x="70"  y="78" width="44" height="32" rx="3"/>
  <text class="code" x="92"  y="101" text-anchor="middle">0</text>
  <rect class="entry-term" x="120" y="78" width="44" height="32" rx="3"/>
  <text class="code" x="142" y="101" text-anchor="middle">1</text>
  <rect class="entry-term" x="170" y="78" width="44" height="32" rx="3"/>
  <text class="code" x="192" y="101" text-anchor="middle">2</text>
  <rect class="entry-term" x="220" y="78" width="44" height="32" rx="3"/>
  <text class="code" x="242" y="101" text-anchor="middle">2</text>
  <rect class="entry-term-new" x="270" y="78" width="44" height="32" rx="3"/>
  <text class="code" x="292" y="101" text-anchor="middle">5</text>
  <rect class="entry-term-new" x="320" y="78" width="44" height="32" rx="3"/>
  <text class="code" x="342" y="101" text-anchor="middle">5</text>

  <!-- Cmds row (index 4 and 5 are newly backfilled, highlighted with entry-match) -->
  <text class="label" x="62" y="144" text-anchor="end">cmds</text>
  <rect class="entry" x="70"  y="122" width="44" height="32" rx="3"/>
  <text class="code" x="92"  y="145" text-anchor="middle">ø</text>
  <rect class="entry" x="120" y="122" width="44" height="32" rx="3"/>
  <text class="code" x="142" y="145" text-anchor="middle">ø</text>
  <rect class="entry" x="170" y="122" width="44" height="32" rx="3"/>
  <text class="code" x="192" y="145" text-anchor="middle">ø</text>
  <rect class="entry-cmd" x="220" y="122" width="44" height="32" rx="3"/>
  <text class="code" x="242" y="145" text-anchor="middle">c3</text>
  <rect class="entry-match" x="270" y="122" width="44" height="32" rx="3"/>
  <text class="code" x="292" y="145" text-anchor="middle">ø</text>
  <rect class="entry-match" x="320" y="122" width="44" height="32" rx="3"/>
  <text class="code" x="342" y="145" text-anchor="middle">ø</text>

  <!-- Index axis -->
  <line class="arrow" x1="55" y1="178" x2="540" y2="178"/>
  <text class="small" x="548" y="182">Node 1</text>

  <!-- Index labels -->
  <text class="label" x="62" y="204" text-anchor="end">index</text>
  <text class="small" x="92"  y="204" text-anchor="middle">0</text>
  <text class="small" x="142" y="204" text-anchor="middle">1</text>
  <text class="small" x="192" y="204" text-anchor="middle">2</text>
  <text class="small" x="242" y="204" text-anchor="middle">3</text>
  <text class="small" x="292" y="204" text-anchor="middle">4</text>
  <text class="small" x="342" y="204" text-anchor="middle">5</text>
  <text class="small" x="392" y="204" text-anchor="middle">6</text>
  <text class="small" x="442" y="204" text-anchor="middle">7</text>
  <text class="small" x="492" y="204" text-anchor="middle">8</text>
  <text class="small" x="542" y="204" text-anchor="middle">9</text>

  <!-- Legend -->
  <rect class="entry-match" x="20" y="222" width="14" height="14" rx="2"/>
  <text class="small" x="40" y="234">newly backfilled empty command</text>
</svg>
