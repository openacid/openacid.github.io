<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" role="img" aria-label="Storage layout: terms and cmds aligned by index">
  <style>
    /* Mirrors assets/svg.css for inline rendering (img sandbox blocks external CSS). */
    svg { background: #f8fafc; color: #172033;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .canvas { fill: #f8fafc; }
    .title { fill: #172033; font-size: 18px; font-weight: 700; }
    .label { fill: #172033; font-size: 13px; font-weight: 650; }
    .small { fill: #667085; font-size: 12px; font-weight: 500; }
    .code { fill: #172033; font-family: "SFMono-Regular", Consolas,
      "Liberation Mono", Menlo, monospace; font-size: 18px; }
    .entry { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.25; }
    .entry-term { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1.25; }
    .entry-cmd { fill: #d1fae5; stroke: #10b981; stroke-width: 1.25; }
    .entry-muted { fill: #eef2f7; stroke: #cbd5e1;
      stroke-dasharray: 5 4; stroke-width: 1.25; }
    .arrow { fill: none; stroke: #667085; stroke-width: 2;
      marker-end: url("#arrowhead"); }
  </style>

  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#667085"/>
    </marker>
  </defs>

  <rect class="canvas" width="600" height="200"/>

  <text class="title" x="20" y="26">Storage layout</text>

  <!-- terms row (cells y=54..86) -->
  <text class="label" x="62" y="76" text-anchor="end">terms</text>
  <g>
    <rect class="entry-term" x="70"  y="54" width="44" height="32" rx="3"/>
    <text class="code" x="92"  y="77" text-anchor="middle">0</text>
    <rect class="entry-term" x="120" y="54" width="44" height="32" rx="3"/>
    <text class="code" x="142" y="77" text-anchor="middle">1</text>
    <rect class="entry-term" x="170" y="54" width="44" height="32" rx="3"/>
    <text class="code" x="192" y="77" text-anchor="middle">2</text>
    <rect class="entry-term" x="220" y="54" width="44" height="32" rx="3"/>
    <text class="code" x="242" y="77" text-anchor="middle">2</text>
    <rect class="entry-term" x="270" y="54" width="44" height="32" rx="3"/>
    <text class="code" x="292" y="77" text-anchor="middle">6</text>
    <rect class="entry-term" x="320" y="54" width="44" height="32" rx="3"/>
    <text class="code" x="342" y="77" text-anchor="middle">6</text>
    <rect class="entry-term" x="370" y="54" width="44" height="32" rx="3"/>
    <text class="code" x="392" y="77" text-anchor="middle">6</text>
    <rect class="entry-term" x="420" y="54" width="44" height="32" rx="3"/>
    <text class="code" x="442" y="77" text-anchor="middle">6</text>
    <rect class="entry-term" x="470" y="54" width="44" height="32" rx="3"/>
    <text class="code" x="492" y="77" text-anchor="middle">8</text>
    <rect class="entry-term" x="520" y="54" width="44" height="32" rx="3"/>
    <text class="code" x="542" y="77" text-anchor="middle">9</text>
  </g>

  <!-- cmds row (cells y=98..130) -->
  <text class="label" x="62" y="120" text-anchor="end">cmds</text>
  <g>
    <rect class="entry" x="70"  y="98" width="44" height="32" rx="3"/>
    <text class="code" x="92"  y="121" text-anchor="middle">ø</text>
    <rect class="entry" x="120" y="98" width="44" height="32" rx="3"/>
    <text class="code" x="142" y="121" text-anchor="middle">ø</text>
    <rect class="entry" x="170" y="98" width="44" height="32" rx="3"/>
    <text class="code" x="192" y="121" text-anchor="middle">ø</text>
    <rect class="entry-cmd" x="220" y="98" width="44" height="32" rx="3"/>
    <text class="code" x="242" y="121" text-anchor="middle">C3</text>
    <rect class="entry" x="270" y="98" width="44" height="32" rx="3"/>
    <text class="code" x="292" y="121" text-anchor="middle">ø</text>
    <rect class="entry" x="320" y="98" width="44" height="32" rx="3"/>
    <text class="code" x="342" y="121" text-anchor="middle">ø</text>
    <rect class="entry" x="370" y="98" width="44" height="32" rx="3"/>
    <text class="code" x="392" y="121" text-anchor="middle">ø</text>
    <rect class="entry-cmd" x="420" y="98" width="44" height="32" rx="3"/>
    <text class="code" x="442" y="121" text-anchor="middle">C7</text>
    <!-- index 8 and 9: terms exist but cmds do not yet -->
    <rect class="entry-muted" x="470" y="98" width="44" height="32" rx="3"/>
    <rect class="entry-muted" x="520" y="98" width="44" height="32" rx="3"/>
  </g>

  <!-- index axis -->
  <line class="arrow" x1="55" y1="152" x2="580" y2="152"/>

  <!-- index labels -->
  <text class="label" x="62" y="174" text-anchor="end">index</text>
  <g>
    <text class="small" x="92"  y="174" text-anchor="middle">0</text>
    <text class="small" x="142" y="174" text-anchor="middle">1</text>
    <text class="small" x="192" y="174" text-anchor="middle">2</text>
    <text class="small" x="242" y="174" text-anchor="middle">3</text>
    <text class="small" x="292" y="174" text-anchor="middle">4</text>
    <text class="small" x="342" y="174" text-anchor="middle">5</text>
    <text class="small" x="392" y="174" text-anchor="middle">6</text>
    <text class="small" x="442" y="174" text-anchor="middle">7</text>
    <text class="small" x="492" y="174" text-anchor="middle">8</text>
    <text class="small" x="542" y="174" text-anchor="middle">9</text>
  </g>
</svg>
