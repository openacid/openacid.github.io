<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">The layers of EzRaft and OpenRaft</title>
  <desc id="desc">Users implement only the EzApp request, response, apply, and read logic. EzRaft provides storage adapters, networking, and service APIs. OpenRaft implements consensus underneath.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f1b3d" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
      text:not([fill]) { fill: #0f1b3d; }
      .title { font-size: 30px; font-weight: 750; }
      .layer-title { font-size: 25px; font-weight: 750; }
      .label { font-size: 18px; font-weight: 700; }
      .body { font-size: 16px; }
      .body:not([fill]) { fill: #475569; }
      .small { font-size: 14px; }
      .small:not([fill]) { fill: #64748b; }
      .mono { font-family: "SFMono-Regular", Consolas, monospace; font-size: 16px; font-weight: 650; }
    </style>
  </defs>

  <rect x="10" y="10" width="1180" height="740" rx="28" fill="#f8fafc" stroke="#dbe4ee"/>
  <text x="60" y="66" class="title">From Business Logic to Raft Consensus</text>

  <g transform="translate(842 39)">
    <rect width="22" height="22" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="32" y="17" class="small">You write</text>
    <rect x="132" width="22" height="22" rx="6" fill="#ccfbf1" stroke="#0f8f87"/>
    <text x="164" y="17" class="small">EzRaft handles</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="120" y="104" width="960" height="202" rx="24" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  </g>
  <rect x="148" y="128" width="108" height="32" rx="16" fill="#2563eb"/>
  <text x="202" y="150" text-anchor="middle" fill="#ffffff" class="small" style="font-weight:700">You write</text>
  <text x="280" y="153" class="layer-title">EzApp: Application State and Business Logic</text>
  <text x="280" y="181" class="body">Define only your application's semantics</text>

  <g transform="translate(150 208)">
    <rect width="202" height="68" rx="14" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="101" y="29" text-anchor="middle" class="mono">Request</text>
    <text x="101" y="52" text-anchor="middle" class="small">Request type</text>
  </g>
  <g transform="translate(382 208)">
    <rect width="202" height="68" rx="14" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="101" y="29" text-anchor="middle" class="mono">Response</text>
    <text x="101" y="52" text-anchor="middle" class="small">Response type</text>
  </g>
  <g transform="translate(614 208)">
    <rect width="202" height="68" rx="14" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="101" y="29" text-anchor="middle" class="mono">apply()</text>
    <text x="101" y="52" text-anchor="middle" class="small">Mutate state</text>
  </g>
  <g transform="translate(846 208)">
    <rect width="202" height="68" rx="14" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="101" y="29" text-anchor="middle" class="mono">read()</text>
    <text x="101" y="52" text-anchor="middle" class="small">Read local state</text>
  </g>

  <line x1="600" y1="306" x2="600" y2="340" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="120" y="344" width="960" height="230" rx="24" fill="#ecfdf9" stroke="#0f8f87" stroke-width="2"/>
  </g>
  <rect x="148" y="368" width="108" height="32" rx="16" fill="#0f8f87"/>
  <text x="202" y="390" text-anchor="middle" fill="#ffffff" class="small" style="font-weight:700">Handled</text>
  <text x="280" y="393" class="layer-title">EzRaft: Turns OpenRaft into a Ready-to-Use Service</text>

  <g transform="translate(150 430)">
    <rect width="282" height="92" rx="15" fill="#ffffff" stroke="#99e6d7"/>
    <circle cx="34" cy="34" r="15" fill="#ccfbf1" stroke="#0f8f87"/>
    <path d="M25 32h18M25 38h18M28 26h12" stroke="#0f8f87" stroke-width="2" stroke-linecap="round"/>
    <text x="60" y="34" class="label">Storage Adapter</text>
    <text x="60" y="61" class="body">Logs, metadata, snapshots</text>
    <text x="60" y="82" class="small">Built-in FileStorage; replaceable</text>
  </g>
  <g transform="translate(459 430)">
    <rect width="282" height="92" rx="15" fill="#ffffff" stroke="#99e6d7"/>
    <circle cx="34" cy="34" r="15" fill="#ccfbf1" stroke="#0f8f87"/>
    <circle cx="28" cy="34" r="3" fill="#0f8f87"/>
    <circle cx="40" cy="27" r="3" fill="#0f8f87"/>
    <circle cx="40" cy="41" r="3" fill="#0f8f87"/>
    <path d="M31 32l6-4M31 36l6 4" stroke="#0f8f87" stroke-width="2"/>
    <text x="60" y="34" class="label">Networking</text>
    <text x="60" y="61" class="body">Raft RPC and snapshot transfer</text>
    <text x="60" y="82" class="small">Forwards non-leader writes</text>
  </g>
  <g transform="translate(768 430)">
    <rect width="282" height="92" rx="15" fill="#ffffff" stroke="#99e6d7"/>
    <circle cx="34" cy="34" r="15" fill="#ccfbf1" stroke="#0f8f87"/>
    <path d="M26 28h16v12H26zM30 24h8M30 44h8" fill="none" stroke="#0f8f87" stroke-width="2" stroke-linecap="round"/>
    <text x="60" y="34" class="label">Service API</text>
    <text x="60" y="61" class="body">write、read、join、metrics</text>
    <text x="60" y="82" class="small">Ready-to-use example HTTP server</text>
  </g>
  <rect x="360" y="538" width="480" height="26" rx="13" fill="#d6f5ee"/>
  <text x="600" y="557" text-anchor="middle" class="small" style="fill:#0f766e;font-weight:700">Node ID assignment · learner promotion · state serialization</text>

  <line x1="600" y1="574" x2="600" y2="608" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="120" y="612" width="960" height="104" rx="24" fill="#0f1b3d"/>
  </g>
  <text x="158" y="657" class="layer-title" fill="#ffffff">OpenRaft</text>
  <text x="158" y="687" fill="#b9c7e8" class="body">Elections · log replication · quorum commits · membership · recovery</text>
  <rect x="870" y="640" width="174" height="42" rx="21" fill="#1d2d59" stroke="#4b65a5"/>
  <text x="957" y="667" text-anchor="middle" fill="#dce6ff" class="label">Consensus Engine</text>
</svg>
