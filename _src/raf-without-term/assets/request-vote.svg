  <text class="label" x="152" y="572" text-anchor="end">index</text>
  <text class="small" x="182" y="572" text-anchor="middle">0</text>
  <text class="small" x="232" y="572" text-anchor="middle">1</text>
  <text class="small" x="282" y="572" text-anchor="middle">2</text>
  <text class="small" x="332" y="572" text-anchor="middle">3</text>
  <text class="small" x="382" y="572" text-anchor="middle">4</text>
  <text class="small" x="432" y="572" text-anchor="middle">5</text>
  <text class="small" x="482" y="572" text-anchor="middle">6</text>
  <text class="small" x="532" y="572" text-anchor="middle">7</text>
  <text class="small" x="582" y="572" text-anchor="middle">8</text>
  <text class="small" x="632" y="572" text-anchor="middle">9</text>

  <!-- ============ Node 4: rejected, last log id=(4,4) ============ -->
  <text class="label-rejected" x="130" y="614">rejected: last log id = (4,4)</text>

  <text class="label" x="152" y="646" text-anchor="end">terms</text>
  <rect class="entry-term" x="160" y="624" width="44" height="32" rx="3"/>
  <text class="code" x="182" y="647" text-anchor="middle">0</text>
  <rect class="entry-term" x="210" y="624" width="44" height="32" rx="3"/>
  <text class="code" x="232" y="647" text-anchor="middle">1</text>
  <rect class="entry-term" x="260" y="624" width="44" height="32" rx="3"/>
  <text class="code" x="282" y="647" text-anchor="middle">2</text>
  <rect class="entry-term" x="310" y="624" width="44" height="32" rx="3"/>
  <text class="code" x="332" y="647" text-anchor="middle">2</text>
  <rect class="entry-conflict" x="360" y="624" width="44" height="32" rx="3"/>
  <text class="code" x="382" y="647" text-anchor="middle">4</text>

  <text class="label" x="152" y="690" text-anchor="end">cmds</text>
  <rect class="entry" x="160" y="668" width="44" height="32" rx="3"/>
  <text class="code" x="182" y="691" text-anchor="middle">ø</text>
  <rect class="entry" x="210" y="668" width="44" height="32" rx="3"/>
  <text class="code" x="232" y="691" text-anchor="middle">ø</text>
  <rect class="entry" x="260" y="668" width="44" height="32" rx="3"/>
  <text class="code" x="282" y="691" text-anchor="middle">ø</text>
  <rect class="entry-cmd" x="310" y="668" width="44" height="32" rx="3"/>
  <text class="code" x="332" y="691" text-anchor="middle">c3</text>
  <rect class="entry-conflict" x="360" y="668" width="44" height="32" rx="3"/>
  <text class="code" x="382" y="691" text-anchor="middle">ø</text>

  <line class="arrow" x1="145" y1="720" x2="625" y2="720"/>
  <text class="node-label" x="632" y="724">Node 4</text>

  <text class="label" x="152" y="742" text-anchor="end">index</text>
  <text class="small" x="182" y="742" text-anchor="middle">0</text>
  <text class="small" x="232" y="742" text-anchor="middle">1</text>
  <text class="small" x="282" y="742" text-anchor="middle">2</text>
  <text class="small" x="332" y="742" text-anchor="middle">3</text>
