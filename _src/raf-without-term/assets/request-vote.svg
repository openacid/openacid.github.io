  <text class="small" x="232" y="414" text-anchor="middle">1</text>
  <text class="small" x="282" y="414" text-anchor="middle">2</text>
  <text class="small" x="332" y="414" text-anchor="middle">3</text>
  <text class="small" x="382" y="414" text-anchor="middle">4</text>
  <text class="small" x="432" y="414" text-anchor="middle">5</text>
  <text class="small" x="482" y="414" text-anchor="middle">6</text>
  <text class="small" x="532" y="414" text-anchor="middle">7</text>
  <text class="small" x="582" y="414" text-anchor="middle">8</text>
  <text class="small" x="632" y="414" text-anchor="middle">9</text>

  <!-- ============ Node 3: rejected, term=7 ============ -->
  <text class="label-rejected" x="130" y="444">rejected: term=7</text>

  <text class="label" x="152" y="476" text-anchor="end">terms</text>
  <rect class="entry-term" x="160" y="454" width="44" height="32" rx="3"/>
  <text class="code" x="182" y="477" text-anchor="middle">0</text>
  <rect class="entry-term" x="210" y="454" width="44" height="32" rx="3"/>
  <text class="code" x="232" y="477" text-anchor="middle">1</text>
  <rect class="entry-term" x="260" y="454" width="44" height="32" rx="3"/>
  <text class="code" x="282" y="477" text-anchor="middle">2</text>
  <rect class="entry-term" x="310" y="454" width="44" height="32" rx="3"/>
  <text class="code" x="332" y="477" text-anchor="middle">2</text>
  <rect class="entry-term" x="360" y="454" width="44" height="32" rx="3"/>
  <text class="code" x="382" y="477" text-anchor="middle">4</text>
  <rect class="entry-term" x="410" y="454" width="44" height="32" rx="3"/>
  <text class="code" x="432" y="477" text-anchor="middle">5</text>
  <rect class="entry-term" x="460" y="454" width="44" height="32" rx="3"/>
  <text class="code" x="482" y="477" text-anchor="middle">6</text>
  <rect class="entry-conflict" x="510" y="454" width="44" height="32" rx="3"/>
  <text class="code" x="532" y="477" text-anchor="middle">7</text>

  <text class="label" x="152" y="520" text-anchor="end">cmds</text>
  <rect class="entry" x="160" y="498" width="44" height="32" rx="3"/>
  <text class="code" x="182" y="521" text-anchor="middle">ø</text>
  <rect class="entry" x="210" y="498" width="44" height="32" rx="3"/>
  <text class="code" x="232" y="521" text-anchor="middle">ø</text>
  <rect class="entry" x="260" y="498" width="44" height="32" rx="3"/>
  <text class="code" x="282" y="521" text-anchor="middle">ø</text>
  <rect class="entry-cmd" x="310" y="498" width="44" height="32" rx="3"/>
  <text class="code" x="332" y="521" text-anchor="middle">c3</text>

  <line class="arrow" x1="145" y1="550" x2="625" y2="550"/>
